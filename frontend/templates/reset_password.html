
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer contraseña | CitaFácil</title>

    <!-- CSS GENERAL -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- CSS ESPECÍFICO -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/reset_password.css') }}">

    <!-- JAVASCRIPT -->
    <script src="{{ url_for('static', filename='js/api.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/reset_password.js') }}" defer></script>
</head>

<body>

    <main class="reset-container">

        <section class="reset-card">

            <div class="reset-icon">
                🔐
            </div>

            <div class="reset-heading">

                <p class="eyebrow">
                    SEGURIDAD CITAFÁCIL
                </p>

                <h1>Restablecer contraseña</h1>

                <p>
                    Ingresa tu nueva contraseña para recuperar
                    el acceso a tu cuenta.
                </p>

            </div>

            <form id="resetPasswordForm" novalidate>

                <!-- NUEVA CONTRASEÑA -->

                <label for="newPassword">
                    Nueva contraseña
                </label>

                <div class="reset-input-wrap">

                    <input
                        type="password"
                        id="newPassword"
                        name="nueva_contrasena"
                        placeholder="Mínimo 8 caracteres"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="newPassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁
                    </button>

                </div>

                <!-- CONFIRMAR CONTRASEÑA -->

                <label for="confirmPassword">
                    Confirmar contraseña
                </label>

                <div class="reset-input-wrap">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmar_contrasena"
                        placeholder="Repite tu contraseña"
                        autocomplete="new-password"
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁
                    </button>

                </div>

                <!-- REQUISITOS -->

                <p class="password-hint">
                    La contraseña debe contener entre 8 y 128 caracteres.
                </p>

                <!-- MENSAJES -->

                <p
                    id="resetMessage"
                    class="reset-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <!-- BOTÓN -->

                <button
                    type="submit"
                    id="resetButton"
                    class="reset-submit"
                >
                    Actualizar contraseña
                </button>

            </form>

            <div class="reset-footer">

                <a href="{{ url_for('inicio') }}">
                    Volver al inicio de sesión
                </a>

            </div>

        </section>

    </main>

</body>
</html>
