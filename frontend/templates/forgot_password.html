<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña | CitaFácil</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">
</head>

<body>

    <main class="forgot-container">

        <section class="forgot-card">

            <div class="forgot-icon">
                <span>🔐</span>
            </div>

            <h1>¿Olvidaste tu contraseña?</h1>

            <p class="forgot-description">
                Ingresa el correo electrónico asociado a tu cuenta.
                Te enviaremos un enlace para restablecer tu contraseña.
            </p>

            <form id="forgotPasswordForm">

                <div class="form-group">
                    <label for="email">Correo electrónico</label>

                    <input
                        type="email"
                        id="email"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        maxlength="100"
                        autocomplete="email"
                        required
                    >
                </div>

                <div id="forgotMessage"
                     class="forgot-message"
                     role="alert"
                     aria-live="polite">
                </div>

                <button type="submit" id="forgotButton">
                    Enviar enlace
                </button>

            </form>

            <div class="forgot-footer">
                <a href="/login">Volver al inicio de sesión</a>
            </div>

        </section>

    </main>

    <script src="{{ url_for('static', filename='js/api.js') }}" defer></script>
    <script src="{{ url_for('static', filename='js/forgot_password.js') }}" defer></script>

</body>
</html>
